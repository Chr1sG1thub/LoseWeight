    label { font-weight: 600; color: #333; display: block; margin-top: 1rem; }
    .fields { background: #f8f9fa; padding: 1.5rem; border-radius: 8px; border-left: 4px solid #007bff; }
    .input-group { display: flex; gap: 0.5rem; align-items: end; }
    .time-input { flex: 1; }
    .duration-input { flex: 2; }
    button { 
      background: #007bff; 
      color: white; 
      border: none; 
      padding: 1rem 2rem; 
      font-size: 1.1rem; 
      border-radius: 8px; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 1.5rem;
      font-weight: 600;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
  </style>

    const select = document.getElementById('colSelect');
    cols.forEach(col => {

      option.value = col.nom;
      option.textContent = col.nom;
      select.appendChild(option);
    });

    // Col selection handler (same as before)
    select.addEventListener('change', (e) => {
      updateFields();
    });

    // Time parser (same as before)
    function parseTimeToSeconds(timeStr) {
      if (!timeStr) return 0;
      let seconds = 0;
      const minutesMatch = timeStr.match(/(\d+)m/);
      const secondsMatch = timeStr.match(/(\d+)s/);
      if (minutesMatch) seconds += parseInt(minutesMatch[1]) * 60;
      if (secondsMatch) seconds += parseInt(secondsMatch[1]);
      return seconds;
    }

    document.getElementById('timeInput').addEventListener('input', (e) => {
      const seconds = parseTimeToSeconds(e.target.value.trim());
      document.getElementById('duration4').value = seconds || '';
      updateSubmitButton();
    });

    // Update populated fields

      const selectedNom = document.getElementById('colSelect').value;

        document.getElementById('distance4').value = col.longueur_km;
      } else {
        document.getElementById('gradient4').value = '';
        document.getElementById('distance4').value = '';
      }
      updateSubmitButton();
    }
