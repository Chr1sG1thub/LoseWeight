    // Populate dropdown
    const select = document.getElementById('colSelect');
    cols.forEach(col => {
      const option = document.createElement('option');
      option.value = col.nom;
      option.textContent = col.nom;
      select.appendChild(option);
    });

    // Handle selection
    select.addEventListener('change', (e) => {
      const selectedNom = e.target.value;
      const col = cols.find(c => c.nom === selectedNom);
      
      if (col) {
        document.getElementById('gradient4').value = col.pente_moy_pct;
        document.getElementById('distance4').value = col.longueur_km;
      } else {
        document.getElementById('gradient4').value = '';
        document.getElementById('distance4').value = '';
      }
    });
    
function parseDurationToSeconds(str) {
  if (typeof str !== "string") return NaN;
  str = str.trim();

  // Plain number like "750" → seconds
  if (/^\d+(\.\d+)?$/.test(str)) {
    return Number(str);
  }

  // Match "12m", "12m30s", "12m30", "750s", "30"
  const match = str.match(/^(?:(\d+(?:\.\d+)?)m)?(?:(\d+(?:\.\d+)?)s?)?$/i);
  if (!match) return NaN;

  const minutes = match[1] ? parseFloat(match[1]) : 0;
  const seconds = match[2] ? parseFloat(match[2]) : 0;

  return minutes * 60 + seconds;
}
  
    const g = 9.81; // m/s^2
    const crr = 0.005;
    const rho = 1.226; // kg/m^3
    const cda = 0.45;
    

    const entryForm = document.getElementById('entry-form');

    entryForm.onsubmit = async (e) => {
      e.preventDefault();


      if (entryForm.gradient4.value.trim().length != 0 &&
          entryForm.distance4.value.trim().length != 0 &&
          entryForm.time4.value.trim().length != 0 &&
          entryForm.mass4.value.trim().length != 0) {
          
      const gradient4 = parseFloat(entryForm.gradient4.value);
      const distance4 = parseFloat(entryForm.distance4.value);
      const time4 = parseDurationToSeconds(entryForm.time4.value);
      const mass4 = parseFloat(entryForm.mass4.value);
        

      const power4 = (mass4*g*gradient4/100*(distance4*1000/time4)+crr*mass4*g*Math.cos(gradient4/100)*(distance4*1000/time4)+0.5*rho*cda*(distance4*1000/time4)**2).toFixed(0);
     
      const time5 = (distance4*3600/((-(mass4*g*(gradient4/100+crr*Math.cos(gradient4/100)))+Math.sqrt((mass4*g*(gradient4/100+crr*Math.cos(gradient4/100)))**2-4*0.5*rho*cda*(-power4)))/(2*0.5*rho*cda)*3.6)).toFixed(0);
      const time5Plus1 = (distance4*3600/((-((mass4+1)*g*(gradient4/100+crr*Math.cos(gradient4/100)))+Math.sqrt(((mass4+1)*g*(gradient4/100+crr*Math.cos(gradient4/100)))**2-4*0.5*rho*cda*(-power4)))/(2*0.5*rho*cda)*3.6)).toFixed(0);
        console.log(power4);
