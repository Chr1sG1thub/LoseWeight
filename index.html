<!DOCTYPE html>
<html>

<head>
  <title>LoseWeight</title>
  <style>
    * {
      font-family: Arial, sans-serif;
    }
    input {
      width: 120px;
      text-align: right;
    }

    .result {
      background-color: chartreuse;
      text-size: 12px;
      text-align: right;
    }

  </style>
</head>

<body>

    <form id="entry-form">

      <table>
        <tr><strong><td>Gradient (%)</td><td>Distance (km)</td><td>Velocity (km/h)</td><td>Mass (kg)</td><td>Power (W)</td><td>Time (s)</td></strong></tr>
        <tr><td style="background-color: yellow"><input type="number" step="0.1" id="gradient4"></td><td style="background-color: yellow"><input type="number" step="0.01" id="distance4"></td><td></td><td style="background-color: yellow"><input type="number" id="mass4"></td><td class="result"><span id="power4">&nbsp;</span></td><td style="background-color: yellow"><input type="number" id="time4"></td></tr>
        <tr><td style="background-color: yellow"><input type="number" step="0.1" id="gradient5"></td><td style="background-color: yellow"><input type="number" step="0.01" id="distance5"></td><td></td><td style="background-color: yellow"><input type="number" id="mass5"></td><td style="background-color: yellow"><input type="number" id="power5"></td><td class="result"><span id="time5">&nbsp;</span></td></tr>
      </table>

      
     <br/>
      <button type="submit">Submit</button>

    </form>


  <script>
    
    const g = 9.81; // m/s^2
    const crr = 0.005;
    const rho = 1.226; // kg/m^3
    const cda = 0.45;
    

    const entryForm = document.getElementById('entry-form');

    entryForm.onsubmit = async (e) => {
      e.preventDefault();


      if (entryForm.gradient4.value.trim().length != 0 &&
          entryForm.distance4.value.trim().length != 0 &&
          entryForm.time4.value.trim().length != 0 &&
          entryForm.mass4.value.trim().length != 0) {
          
      const gradient4 = parseFloat(entryForm.gradient4.value);
      const distance4 = parseFloat(entryForm.distance4.value);
      const time4 = parseFloat(entryForm.time4.value);
      const mass4 = parseFloat(entryForm.mass4.value);
        

      const power4 = (mass4*g*gradient4/100*(distance4*1000/time4)+crr*mass4*g*Math.cos(gradient4/100)*(distance4*1000/time4)+0.5*rho*cda*(distance4*1000/time4)**2).toFixed(0);
      document.getElementById('power4').textContent = power4;

     
      const time5 = (distance4*3600/((-(mass4*g*(gradient4/100+crr*Math.cos(gradient4/100)))+Math.sqrt((mass4*g*(gradient4/100+crr*Math.cos(gradient4/100)))**2-4*0.5*rho*cda*(-power4)))/(2*0.5*rho*cda)*3.6)).toFixed(0);
      const time5Plus1 = (distance4*3600/((-((mass4+1)*g*(gradient4/100+crr*Math.cos(gradient4/100)))+Math.sqrt(((mass4+1)*g*(gradient4/100+crr*Math.cos(gradient4/100)))**2-4*0.5*rho*cda*(-power4)))/(2*0.5*rho*cda)*3.6)).toFixed(0);
      document.getElementById('time5').textContent = time5Plus1-time5;
       
      }
    }; //entryForm.onsubmit

  </script>

</body>

</html>
